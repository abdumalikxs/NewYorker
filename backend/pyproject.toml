[project]
name = "newyorker-backend"
version = "0.1.0"
description = "FastAPI streaming and visual state orchestrator for the New Yorker spatial AI companion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "google-genai>=0.1.1",
    "supabase>=2.0.0",
    "motor>=3.5.1",
    "pymongo>=4.8.0",
    "python-multipart>=0.0.9",
    "psycopg2-binary>=2.9.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

